name: Probe Domestic HTML Host
on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/probe-domestic-host.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect SharingHTML JS
        run: |
          set -e
          base='https://sharinghtml.com'
          curl -L -sS "$base/zh-CN/" -o /tmp/page
          grep -Eo '<script[^>]+src="[^"]+"' /tmp/page | sed -E 's/.*src="([^"]+)".*/\1/' > /tmp/scripts
          : > /tmp/alljs
          while read -r src; do
            case "$src" in
              http*) url="$src" ;;
              *) url="$base$src" ;;
            esac
            curl -L -sS "$url" >> /tmp/alljs || true
            echo >> /tmp/alljs
          done < /tmp/scripts
          python3 - <<'PY'
          import re
          s=open('/tmp/alljs','r',encoding='utf-8',errors='ignore').read()
          print('--- candidate endpoints ---')
          vals=set(re.findall(r'https://[^"\'\s]+|/api/[A-Za-z0-9_/?=&.%:-]+',s))
          for v in sorted(vals):
              if any(k in v.lower() for k in ('upload','file','html','api')):
                  print(v[:500])
          print('--- upload contexts ---')
          for m in re.finditer(r'upload|multipart|FormData|manageUrl|publicUrl|shareUrl',s,re.I):
              print(s[max(0,m.start()-220):min(len(s),m.end()+420)].replace('\n',' ')[:1000])
          PY
